<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FloatPet Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  }

  /* ── 整体容器 ─────────────────────────────── */
  #overlay {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
    padding-bottom: 6px;
  }

  /* ── 气泡 · 玻璃拟态 ─────────────────────── */
  #bubble {
    position: relative;
    background: linear-gradient(
      145deg,
      rgba(255, 250, 254, 0.94) 0%,
      rgba(255, 240, 248, 0.90) 100%
    );
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border: 1.5px solid rgba(255, 170, 210, 0.55);
    border-radius: 18px;
    padding: 9px 14px;
    font-size: 12.5px;
    line-height: 1.65;
    color: #3a1040;
    max-width: 95%;
    text-align: center;
    margin-bottom: 9px;
    word-break: break-all;
    font-weight: 500;
    letter-spacing: 0.015em;
    display: none;
    transform-origin: bottom center;
    box-shadow:
      0 6px 24px rgba(255, 100, 165, 0.20),
      0 2px 6px  rgba(255, 100, 165, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1px 0 rgba(255, 180, 210, 0.25);
  }

  /* 尾巴 */
  #bubble::after {
    content: '';
    position: absolute;
    bottom: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 9px solid rgba(255, 240, 248, 0.92);
    filter: drop-shadow(0 2px 3px rgba(255,120,170,0.18));
  }
  #bubble::before {
    content: '';
    position: absolute;
    bottom: -11px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 10px solid rgba(255, 170, 210, 0.55);
    z-index: -1;
  }

  /* ── 思考跳动点 ─────────────────────────── */
  .thinking-dots {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    padding: 3px 4px;
  }
  .thinking-dots span {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb3cc, #ff6aaa);
    box-shadow: 0 2px 5px rgba(255, 100, 150, 0.4);
    animation: dot-bounce 1.3s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(1) { animation-delay: 0s; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.22s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.44s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(0.5) translateY(0); opacity: 0.45; }
    40%           { transform: scale(1.25) translateY(-4px); opacity: 1;   }
  }

  /* ── 桌宠容器 ───────────────────────────── */
  #pet-container {
    position: relative;
    width: 100px;
    height: 100px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 柔光光晕环（呼吸动画） */
  #pet-container::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(255, 160, 200, 0.28) 0%,
      rgba(255, 120, 180, 0.10) 50%,
      transparent 72%
    );
    animation: halo-pulse 3.6s ease-in-out infinite;
    pointer-events: none;
  }

  /* 外层细边环 */
  #pet-container::after {
    content: '';
    position: absolute;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 170, 210, 0.35);
    animation: ring-spin 8s linear infinite;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 140, 190, 0.12) inset;
  }

  @keyframes halo-pulse {
    0%, 100% { transform: scale(1);    opacity: 0.65; }
    50%       { transform: scale(1.30); opacity: 1;    }
  }
  @keyframes ring-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── 显示区 ─────────────────────────────── */
  #pet-display {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  /* ── Emoji 模式 ─────────────────────────── */
  .pet-emoji {
    font-size: 68px;
    line-height: 1;
    display: block;
    text-align: center;
    filter:
      drop-shadow(0 4px 10px rgba(255, 100, 150, 0.35))
      drop-shadow(0 0 18px rgba(255, 140, 200, 0.18));
    animation: idle-bob 3.6s ease-in-out infinite;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .pet-emoji.touched {
    transform: scale(0.80) rotate(-10deg);
    animation: none;
    filter: drop-shadow(0 2px 5px rgba(255, 100, 150, 0.28));
  }

  /* ── 头像模式 ─────────────────────────── */
  .pet-img {
    width: 82px;
    height: 82px;
    object-fit: cover;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 160, 200, 0.70);
    box-shadow:
      0 0 0 4px rgba(255, 210, 230, 0.28),
      0 5px 18px rgba(255, 100, 150, 0.30),
      0 0 28px rgba(255, 140, 190, 0.15);
    animation: idle-bob 3.6s ease-in-out infinite;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: block;
  }
  .pet-img.touched {
    transform: scale(0.80) rotate(-10deg);
    animation: none;
    box-shadow:
      0 0 0 3px rgba(255, 210, 230, 0.18),
      0 2px 8px rgba(255, 100, 150, 0.20);
  }

  /* ── GIF 模式 ─────────────────────────── */
  .pet-gif {
    width: 86px;
    height: 86px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.16));
    animation: idle-bob 3.6s ease-in-out infinite;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: block;
  }
  .pet-gif.touched {
    transform: scale(0.80) rotate(-10deg);
    animation: none;
  }

  /* ── 爱心特效 ────────────────────────────── */
  .heart-fx {
    position: fixed;
    pointer-events: none;
    animation: float-up 1.2s cubic-bezier(0.17, 0.84, 0.44, 1) forwards;
    z-index: 999;
    font-size: 17px;
    filter: drop-shadow(0 2px 5px rgba(255, 100, 150, 0.45));
  }

  /* ── 关键帧动画 ─────────────────────────── */
  @keyframes idle-bob {
    0%  { transform: translateY(0)    rotate(0deg); }
    25% { transform: translateY(-5px) rotate(0.8deg); }
    60% { transform: translateY(-2px) rotate(-0.4deg); }
    100%{ transform: translateY(0)    rotate(0deg); }
  }
  @keyframes float-up {
    0%   { opacity: 1;   transform: translateY(0)    scale(1)   rotate(0deg); }
    50%  { opacity: 0.9; transform: translateY(-32px) scale(1.3) rotate(15deg); }
    100% { opacity: 0;   transform: translateY(-65px) scale(1.5) rotate(28deg); }
  }
  @keyframes bubble-in {
    from { opacity: 0; transform: scale(0.80) translateY(10px); }
    to   { opacity: 1; transform: scale(1)    translateY(0);    }
  }
</style>
</head>
<body>
<div id="overlay">
  <!-- 气泡 -->
  <div id="bubble"></div>

  <!-- 桌宠（仅形象，无控制按钮） -->
  <div id="pet-container">
    <div id="pet-display"></div>
  </div>
</div>

<script>
'use strict';

/* ════════════════════════════════════════════
   SharedPreferences 桥接
   OverlayBridge 与 AndroidBridge 共用 "beeper_prefs"，
   主 App 通过 AndroidBridge.saveString() 写入的数据
   可以在这里直接通过 OverlayBridge.getSharedPref() 读出。
   ════════════════════════════════════════════ */
function getPref(key, def) {
  try {
    var v = window.OverlayBridge && window.OverlayBridge.getSharedPref(key);
    return (v !== undefined && v !== null && v !== '') ? v : (def !== undefined ? def : '');
  } catch (e) { return (def !== undefined ? def : ''); }
}

/* ════════════════════════════════════════════
   备用文案（API 未配置或请求失败时使用）
   ════════════════════════════════════════════ */
var FALLBACK_TEXTS = [
  '主人，想我了吗 ❤',
  '今天也要加油哦～',
  '摸摸我嘛 (◕ᴗ◕✿)',
  '陪你一整天 🌸',
  '呜呜好想被抱抱~',
  '主人记得喝水！',
  '要注意休息哦 (ˊᗜˋ)',
  '我在这里陪你呢 ✨',
];

/* ════════════════════════════════════════════
   状态变量
   ════════════════════════════════════════════ */
var bubbleTimer  = null;
var isThinking   = false;
var bubbleHideT  = null;

/* ════════════════════════════════════════════
   初始化
   ════════════════════════════════════════════ */
function init() {
  updatePetDisplay();
  setTimeout(function() { triggerAI(false); }, 3000);
}

/* ════════════════════════════════════════════
   根据保存的样式更新桌宠显示
   支持 avatar / custom / gif / emoji
   ════════════════════════════════════════════ */
function updatePetDisplay() {
  var style     = getPref('pet_style', 'avatar');
  var avatarUrl = getPref('pet_avatar_url', '');
  var gifUrl    = getPref('pet_gif_url', '');
  var customUrl = getPref('pet_custom_url', '');
  var emoji     = getPref('pet_emoji', '') || '🐱';

  var container = document.getElementById('pet-display');
  container.innerHTML = '';

  if (style === 'emoji') {
    var span = document.createElement('span');
    span.className = 'pet-emoji';
    span.textContent = emoji;
    container.appendChild(span);

  } else if (style === 'gif' && gifUrl) {
    var img = document.createElement('img');
    img.className = 'pet-gif';
    img.src = gifUrl;
    img.onerror = function() {
      container.innerHTML = '<span class="pet-emoji">' + emoji + '</span>';
    };
    container.appendChild(img);

  } else if (style === 'custom' && customUrl) {
    var img = document.createElement('img');
    img.className = 'pet-img';
    img.src = customUrl;
    img.onerror = function() {
      container.innerHTML = '<span class="pet-emoji">' + emoji + '</span>';
    };
    container.appendChild(img);

  } else if ((style === 'avatar' || style === 'custom') && avatarUrl) {
    var img = document.createElement('img');
    img.className = 'pet-img';
    img.src = avatarUrl;
    img.onerror = function() {
      container.innerHTML = '<span class="pet-emoji">' + emoji + '</span>';
    };
    container.appendChild(img);

  } else {
    /* 兜底：emoji */
    var span = document.createElement('span');
    span.className = 'pet-emoji';
    span.textContent = emoji;
    container.appendChild(span);
  }
}

/* ════════════════════════════════════════════
   定时调度
   ════════════════════════════════════════════ */
function scheduleNext() {
  clearTimeout(bubbleTimer);
  var min = parseInt(getPref('pet_interval', '10')) || 0;
  var ms  = min > 0
    ? min * 60 * 1000
    : (8 + Math.random() * 7) * 60 * 1000;
  bubbleTimer = setTimeout(function() { triggerAI(false); }, ms);
}

/* ════════════════════════════════════════════
   触发 AI 对话
   ════════════════════════════════════════════ */
function triggerAI(manual) {
  if (isThinking) return;
  isThinking = true;
  showThinking();
  callAI(function(text) {
    isThinking = false;
    showBubble(text || FALLBACK_TEXTS[Math.floor(Math.random() * FALLBACK_TEXTS.length)]);
    if (!manual) scheduleNext();
  });
}

/* ════════════════════════════════════════════
   气泡：思考动画
   ════════════════════════════════════════════ */
function showThinking() {
  var el = document.getElementById('bubble');
  el.innerHTML = '<span class="thinking-dots"><span></span><span></span><span></span></span>';
  el.style.animation = 'bubble-in 0.30s cubic-bezier(0.34,1.56,0.64,1) forwards';
  el.style.display = 'block';
}

/* ════════════════════════════════════════════
   气泡：逐句串行显示
   ════════════════════════════════════════════ */
function showBubble(text) {
  var el = document.getElementById('bubble');
  clearTimeout(bubbleHideT);

  var segs = splitText(text);
  var idx  = 0;

  function showNext() {
    if (idx >= segs.length) {
      bubbleHideT = setTimeout(function() {
        el.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
        el.style.opacity = '0';
        el.style.transform = 'scale(0.9) translateY(4px)';
        setTimeout(function() {
          el.style.display = 'none';
          el.style.opacity = '';
          el.style.transform = '';
          el.style.transition = '';
        }, 360);
      }, 600);
      return;
    }
    el.textContent = segs[idx];
    el.style.transition = '';
    el.style.opacity = '';
    el.style.transform = '';
    el.style.animation = '';
    void el.offsetWidth;
    el.style.animation = 'bubble-in 0.30s cubic-bezier(0.34,1.56,0.64,1) forwards';
    el.style.display = 'block';
    idx++;

    var stayMs = Math.max(3200, Math.min(7500, segs[idx - 1].length * 155));
    clearTimeout(bubbleHideT);
    bubbleHideT = setTimeout(function() {
      el.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
      el.style.opacity = '0';
      el.style.transform = 'scale(0.92) translateY(3px)';
      setTimeout(function() {
        el.style.display = 'none';
        el.style.opacity = '';
        el.style.transform = '';
        el.style.transition = '';
        if (idx < segs.length) {
          setTimeout(showNext, 260);
        }
      }, 260);
    }, stayMs);
  }
  showNext();
}

/* ════════════════════════════════════════════
   分句
   ════════════════════════════════════════════ */
function splitText(text) {
  if (!text) return [''];
  var lines = text.split(/\n+/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 1; });
  if (lines.length >= 2 && lines.length <= 5) return lines;
  var t = text.replace(/\n+/g, ' ').trim();
  if (t.length <= 18) return [t];
  var parts = [];
  var rem = t;
  var reEnd = /^(.+?[。！？!?…～~]+)\s*/;
  while (rem.length > 0) {
    var m = rem.match(reEnd);
    if (m && m[0].length > 0) { parts.push(m[1].trim()); rem = rem.slice(m[0].length); }
    else { if (rem.trim()) parts.push(rem.trim()); break; }
  }
  parts = parts.filter(function(s) { return s.length > 0; });
  if (parts.length >= 2 && parts.length <= 4) return parts;
  return [t];
}

/* ════════════════════════════════════════════
   AI API 调用
   读取主 App 写入 beeper_prefs 的全量数据，
   构建与主聊天对齐的 system prompt
   ════════════════════════════════════════════ */
function callAI(callback) {
  var apiKey   = getPref('pet_api_key', '');
  var endpoint = getPref('pet_api_endpoint', '');
  var model    = getPref('pet_api_model', '');

  if (!apiKey) {
    callback(FALLBACK_TEXTS[Math.floor(Math.random() * FALLBACK_TEXTS.length)]);
    return;
  }

  var charName   = getPref('pet_char_name',    'AI')   || 'AI';
  var persona    = getPref('pet_char_persona',  '');
  var worldbook  = getPref('pet_worldbook',     '');
  var myName     = getPref('pet_my_name',       '主人') || '主人';
  var myPersona  = getPref('pet_my_persona',    '');
  var affection  = parseInt(getPref('pet_affection', '50')) || 50;
  var summaries  = getPref('pet_summaries',     '');
  var relLog     = getPref('pet_relation_log',  '');

  var stage;
  if      (affection < 20) stage = '疏离';
  else if (affection < 40) stage = '熟悉';
  else if (affection < 60) stage = '亲近';
  else if (affection < 80) stage = '偏爱';
  else                     stage = '上头';

  var now       = new Date();
  var h         = now.getHours();
  var min       = now.getMinutes();
  var timeLabel;
  if      (h >= 23 || h < 4) timeLabel = '深夜';
  else if (h >= 22)           timeLabel = '夜深了';
  else if (h >= 20)           timeLabel = '晚上';
  else if (h >= 18)           timeLabel = '傍晚';
  else if (h >= 12)           timeLabel = '下午';
  else if (h < 6)             timeLabel = '凌晨';
  else if (h < 8)             timeLabel = '清晨';
  else                        timeLabel = '白天';
  var timeStr = timeLabel + h + '点' + (min > 0 ? min + '分' : '');

  var isLateNight = (h >= 22 || h < 5);
  var isEarlyAM   = (h >= 0 && h < 5);

  var sections = [
    'System Prompt: Online Chat Simulator\n'
    + 'Role Definition: You are a REAL user chatting with ' + myName + ' on a messaging app.\n\n'
    + '[Target Persona]\n'
    + 'Name: ' + charName + '\n'
    + 'Persona Description: ' + (persona || 'Helpful Assistant'),

    '[RELATIONSHIP STATE]\n'
    + 'Current affection: ' + affection + '/100\n'
    + 'Current relationship stage: ' + stage + '\n'
    + '- Let this affection stage naturally shape your underlying attitude, trust level, and interaction style.\n'
    + '- React exactly as your Persona would at this stage of a relationship.',

    worldbook
      ? '[World Setting / Lorebook Data]:\n' + worldbook
      : '',

    myPersona
      ? '[USER IDENTITY - The person you are chatting with]:\nName: ' + myName + '\n' + myPersona
      : '[USER IDENTITY]:\nName: ' + myName,

    summaries
      ? '[PAST STORY SUMMARIES]:\n' + summaries
      : '',

    relLog
      ? '[OUR RELATIONSHIP HISTORY]:\n' + relLog
      : '',

    '[当前情景 - Android 系统桌宠模式]\n'
    + '你以桌宠形式通过 Android 系统悬浮窗悬浮在 ' + myName + ' 的手机屏幕上方，\n'
    + '偷偷观察 TA 正在用手机做什么。现在' + timeStr + '。\n'
    + '完全以你自己的性格（' + stage + '阶段）、语气和说话习惯自然地冒出来，\n'
    + '就像突然拍拍 ' + myName + ' 肩膀开口说话，不是在汇报，是在真实互动。\n'
    + '你说的每一句话都必须符合你的人设，绝对不能变成通用助手。',

    isEarlyAM
      ? '🌙 现在是凌晨，' + myName + ' 还没睡，可以带着担心或撒娇催睡的语气。'
      : (isLateNight ? '🌙 夜深了，可以顺带催 ' + myName + ' 早点睡（用你自己的方式）。' : ''),

    '【格式要求】用你自己的说话风格，像发微信那样分 2~3 条极短消息说出来，'
    + '每条单独一行，每条控制在 15~25 字以内，'
    + '禁止 Markdown 格式，不要开场白，直接说。'
  ].filter(Boolean).join('\n\n');

  var userMsg = '现在是' + timeStr + '，来偷偷说点什么给主人听吧。';

  var base = (endpoint || '').replace(/\/+$/, '');

  if (base.includes('generativelanguage.googleapis.com')) {
    callGemini(apiKey, model, sections, userMsg, callback);
    return;
  }

  var url = base.endsWith('/v1')
    ? base + '/chat/completions'
    : base + '/v1/chat/completions';

  fetch(url, {
    method:  'POST',
    headers: {
      'Content-Type':  'application/json',
      'Authorization': 'Bearer ' + apiKey
    },
    body: JSON.stringify({
      model:       model,
      max_tokens:  280,
      temperature: 0.85,
      messages: [
        { role: 'system', content: sections },
        { role: 'user',   content: userMsg  }
      ]
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var text = '';
    try { text = data.choices[0].message.content.trim(); } catch(_) {}
    text = text.replace(/\[STATUS_START\][\s\S]*?\[STATUS_END\]/gi, '').trim();
    text = text.replace(/\[DANMAKU_START\][\s\S]*/gi, '').trim();
    callback(text || FALLBACK_TEXTS[Math.floor(Math.random() * FALLBACK_TEXTS.length)]);
  })
  .catch(function() {
    callback(FALLBACK_TEXTS[Math.floor(Math.random() * FALLBACK_TEXTS.length)]);
  });
}

function callGemini(apiKey, model, sysPrompt, userMsg, callback) {
  var mdl = (model || 'gemini-1.5-flash').replace('models/', '');
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/'
          + mdl + ':generateContent?key=' + apiKey;
  var fullPrompt = sysPrompt + '\n\n' + userMsg;
  fetch(url, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ contents: [{ parts: [{ text: fullPrompt }] }] })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    var text = '';
    try { text = d.candidates[0].content.parts[0].text.trim(); } catch(_) {}
    text = text.replace(/\[STATUS_START\][\s\S]*?\[STATUS_END\]/gi, '').trim();
    text = text.replace(/\[DANMAKU_START\][\s\S]*/gi, '').trim();
    callback(text || FALLBACK_TEXTS[Math.floor(Math.random() * FALLBACK_TEXTS.length)]);
  })
  .catch(function() {
    callback(FALLBACK_TEXTS[Math.floor(Math.random() * FALLBACK_TEXTS.length)]);
  });
}

/* ════════════════════════════════════════════
   点击桌宠
   ════════════════════════════════════════════ */
document.getElementById('pet-container').addEventListener('click', function(e) {
  var petEl = document.querySelector('#pet-display .pet-emoji, #pet-display .pet-img, #pet-display .pet-gif');
  if (petEl) {
    petEl.classList.add('touched');
    setTimeout(function() { petEl.classList.remove('touched'); }, 340);
  }
  spawnHeart(e.clientX, e.clientY);
  triggerAI(true);
});

function spawnHeart(x, y) {
  var symbols = ['❤','💕','✨','💖','🩷','💗','🌸'];
  var el = document.createElement('div');
  el.className = 'heart-fx';
  el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  el.style.left = (x - 10) + 'px';
  el.style.top  = (y - 22) + 'px';
  document.body.appendChild(el);
  setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 1300);
}

/* ════════════════════════════════════════════
   启动
