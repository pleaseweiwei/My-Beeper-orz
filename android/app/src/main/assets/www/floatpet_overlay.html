<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#pet{width:130px;height:170px;text-align:center;color:#222;font:13px sans-serif}#art{width:96px;height:96px;margin:8px auto 2px;border-radius:50%;object-fit:cover;background:#fff8;border:2px solid #fff;box-shadow:0 3px 12px #0005}#emoji{font-size:70px;line-height:105px}#name{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#ffffffe8;border-radius:12px;padding:4px 8px;display:inline-block}button{border:0;background:#0009;color:white;border-radius:12px;margin-top:5px;font-size:11px;padding:3px 8px}
</style></head><body><div id="pet"><div id="visual" data-drag-handle><img id="art" hidden><span id="emoji">🐱</span></div><div id="name">桌面伙伴</div><br><button onclick="OverlayBridge.openMainApp()">打开</button><button onclick="OverlayBridge.close()">关闭</button></div>
<script>
function get(k){return (window.OverlayBridge&&OverlayBridge.getSharedPref(k))||''}function init(){var avatar=get('pet_avatar_url'),gif=get('pet_gif_url'),custom=get('pet_custom_url'),src=avatar||gif||custom;var img=document.getElementById('art');if(src){img.src=src;img.hidden=false;document.getElementById('emoji').hidden=true}else document.getElementById('emoji').textContent=get('pet_emoji')||'🐱';document.getElementById('name').textContent=get('pet_char_name')||'桌面伙伴'}var drag=null;document.querySelector('[data-drag-handle]').addEventListener('touchstart',function(e){var t=e.touches[0];drag={x:t.clientX,y:t.clientY};e.preventDefault()},{passive:false});document.querySelector('[data-drag-handle]').addEventListener('touchmove',function(e){if(!drag)return;var t=e.touches[0];OverlayBridge.moveBy(Math.round(t.clientX-drag.x),Math.round(t.clientY-drag.y));drag={x:t.clientX,y:t.clientY};e.preventDefault()},{passive:false});document.querySelector('[data-drag-handle]').addEventListener('touchend',function(){drag=null});window.onload=init;
</script></body></html>
