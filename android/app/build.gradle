plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beeper.floatpet'
    compileSdk 34

    defaultConfig {
        applicationId "com.beeper.floatpet"
        minSdk 23          // Android 6.0 (SYSTEM_ALERT_WINDOW 最低要求)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Allow cleartext for custom/self-hosted API endpoints
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'

    // JSON parsing (org.json is included in Android SDK, no extra dep needed)
    // WebView is part of AOSP — no extra dep needed

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
