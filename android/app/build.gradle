plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beeper.floatpet'
    compileSdk 35
    buildToolsVersion '35.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId 'com.beeper.floatpet'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            // 当前仓库没有正式签名文件；先使用 debug 签名，确保可以生成可安装的 release APK。
            signingConfig signingConfigs.debug
        }
    }
}