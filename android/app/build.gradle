plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beeper.floatpet'
    compileSdk 34

    defaultConfig {
        applicationId "com.beeper.floatpet"
        minSdk 26
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName project.hasProperty('versionName') ? project.versionName : "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

/* ──────────────────────────────────────────────────────
   自动把项目根目录的网页文件复制进 assets/
   这样 WebView 就能加载完整的 index.html
   ────────────────────────────────────────────────────── */
def webRoot = project.file('../../')   // android/app/../../  →  小手机/

task copyWebAssets(type: Copy) {
    from webRoot
    include 'index.html'
    include 'version.json'
    include 'manifest.json'
    include 'service-worker.js'
    include 'icon.png'
    include 'js/**'
    include 'css/**'
    // 排除 android 目录本身，避免递归
    exclude 'android/**'
    exclude '.git/**'
    exclude 'node_modules/**'
    into 'src/main/assets'
}

// 每次构建前自动执行（使用 afterEvaluate 确保 AGP 8.x 懒加载任务已注册）
afterEvaluate {
    tasks.named("preBuild").configure {
        dependsOn copyWebAssets
    }
}
