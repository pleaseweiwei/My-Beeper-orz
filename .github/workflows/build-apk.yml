name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 复制 Web 资产到 Android 项目
        run: |
          mkdir -p android/app/src/main/assets/www/css
          mkdir -p android/app/src/main/assets/www/js
          cp index.html android/app/src/main/assets/www/
          cp manifest.json android/app/src/main/assets/www/
          cp service-worker.js android/app/src/main/assets/www/
          cp -r css/ android/app/src/main/assets/www/css/
          cp -r js/ android/app/src/main/assets/www/js/
          if [ -f icon.png ]; then cp icon.png android/app/src/main/assets/www/; fi
          echo "✅ Web 资产复制完成"
          ls -la android/app/src/main/assets/www/

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 小手机-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 显示 APK 信息
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ APK 构建成功！"
            echo "📦 文件大小: $SIZE"
            echo "📍 路径: $APK_PATH"
          else
            echo "❌ APK 文件未找到"
            exit 1
          fi
