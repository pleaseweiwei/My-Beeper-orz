name: 📦 Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 下载并安装 Gradle 8.4
      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      # 4. 接受 Android SDK 许可证 & 安装所需组件
      - name: Accept SDK licenses & install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 5. 生成 local.properties
      - name: Create local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 6. 构建 Debug APK（直接用已安装的 Gradle，不用 wrapper）
      - name: Build Debug APK
        working-directory: android
        run: |
          /opt/gradle/gradle-8.4/bin/gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # 7. 上传 APK（保存 30 天）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatPet-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # 8. 完成提示
      - name: Done
        run: |
          echo "✅ APK 构建并上传完成！"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "请在本次 Actions 运行页面的 Artifacts 区域下载 APK。"
