name: 📦 Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 允许在 GitHub 网页上手动触发

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 安装 Gradle 8.4（不依赖 wrapper jar）
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      # 4. 赋予 gradlew 执行权限（如果存在）
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew 2>/dev/null || true

      # 5. 构建 Debug APK
      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # 6. 上传 APK 为可下载的 Artifact（保存 30 天）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatPet-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 7. 打印 APK 信息
      - name: Show APK info
        run: |
          echo "✅ APK 构建成功！"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "👆 在 Actions 页面的 Artifacts 区域下载 APK"
