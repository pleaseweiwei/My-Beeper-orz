name: 📦 Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 下载并安装 Gradle 8.4
      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      # 4. 接受 Android SDK 许可证 & 安装所需组件
      - name: Accept SDK licenses & install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 5. 生成 local.properties
      - name: Create local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 6. 构建 Debug APK，完整日志保存到文件
      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          /opt/gradle/gradle-8.4/bin/gradle assembleDebug \
            --no-daemon \
            --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # 7. 构建失败时把关键错误提取为 Annotation（无需登录即可看到）
      - name: Show build errors
        if: failure()
        run: |
          echo "=== GRADLE BUILD ERRORS ==="
          grep -E "(error:|Error:|FAILURE|Exception|> Task)" /tmp/gradle-build.log | head -60 || true
          echo ""
          echo "=== LAST 80 LINES ==="
          tail -80 /tmp/gradle-build.log || true
          echo ""
          echo "::error::$(grep -E 'error:|Error:' /tmp/gradle-build.log | head -5 | tr '\n' ' ')"

      # 8. 无论成功失败都上传完整 Gradle 日志
      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: /tmp/gradle-build.log
          retention-days: 7

      # 9. 上传 APK（保存 30 天）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatPet-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # 10. 完成提示
      - name: Done
        run: |
          echo "✅ APK 构建并上传完成！"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
