name: 📦 Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'version.json'   # 防止更新 version.json 后触发无限循环
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release + 推送 version.json 都需要写权限

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码（带 token 以便后续推送）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 下载并安装 Gradle 8.4
      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      # 4. 接受 Android SDK 许可证 & 安装所需组件
      - name: Accept SDK licenses & install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 5. 生成 local.properties
      - name: Create local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 6. 构建 Debug APK，versionCode = github.run_number
      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          /opt/gradle/gradle-8.4/bin/gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}" \
            2>&1 | tee /tmp/gradle-build.log

      # 7. 构建失败时输出关键错误
      - name: Show build errors
        if: failure()
        run: |
          echo "=== GRADLE BUILD ERRORS ==="
          grep -E "(error:|Error:|FAILURE|Exception|> Task)" /tmp/gradle-build.log | head -60 || true
          echo ""
          echo "=== LAST 80 LINES ==="
          tail -80 /tmp/gradle-build.log || true
          echo "::error::$(grep -E 'error:|Error:' /tmp/gradle-build.log | head -5 | tr '\n' ' ')"

      # 8. 无论成功失败都上传完整 Gradle 日志
      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: /tmp/gradle-build.log
          retention-days: 7

      # 9. 上传 APK 为 Artifact（保留 30 天）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beeper-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # 10. 创建 GitHub Release 并附带 APK（用于 App 内自动更新下载）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          body: |
            自动构建版本 #${{ github.run_number }}
            versionCode: ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. 更新仓库根目录的 version.json（App 启动时检查此文件判断是否需要更新）
      - name: Update version.json
        run: |
          cat > version.json << 'JSONEOF'
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk",
            "notes": "构建 #${{ github.run_number }}，包含最新功能与修复"
          }
          JSONEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: update version.json to build #${{ github.run_number }} [skip ci]"
          git push

      # 12. 完成提示
      - name: Done
        run: |
          echo "✅ APK 构建并上传完成！"
          echo "📦 Release: https://github.com/${{ github.repository }}/releases/latest"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
